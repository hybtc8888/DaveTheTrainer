name: CI

on:
  push:
    branches: ["main", "master", "trainer-v1"]
  pull_request:

jobs:
  test:
    name: Swift Tests
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test
