name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: Swift Tests
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: >
          swift test
          --skip InstalledGameIntegrationTests
          --skip Il2CppFeatureLocatorTests
          --skip MachOModuleResolverTests
